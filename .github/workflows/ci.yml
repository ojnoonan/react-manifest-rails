name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  release_tag_guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Ensure version bump has matching tag
      run: |
        set -euo pipefail

        BEFORE="${{ github.event.before }}"
        AFTER="${{ github.sha }}"

        if ! git diff --name-only "$BEFORE" "$AFTER" | grep -q '^lib/react_manifest/version.rb$'; then
          echo "No version bump in this push; skipping release tag guard."
          exit 0
        fi

        VERSION=$(ruby -e 'v = File.read("lib/react_manifest/version.rb")[/VERSION\s*=\s*"([^"]+)"/, 1]; abort("Could not parse VERSION") unless v; puts v')
        TAG="v${VERSION}"

        git fetch --tags --force

        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "Found matching release tag ${TAG}."
          exit 0
        fi

        echo "Version was bumped to ${VERSION}, but tag ${TAG} was not found."
        echo "Push the matching tag to trigger release workflow:"
        echo "  git tag -a ${TAG} -m \"Release ${TAG}\""
        echo "  git push origin ${TAG}"
        exit 1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Run RuboCop
      run: bundle exec rubocop --parallel

  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Security audit
      run: |
        gem install bundler-audit
        bundle-audit check --update
